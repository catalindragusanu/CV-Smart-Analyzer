name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build release package
      run: mvn clean package -DskipTests
      env:
        MAVEN_OPTS: "-Xmx2g"

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## CV Smart Analyzer Release ${{ steps.get_version.outputs.VERSION }}

          ### Changes
          - See commit history for detailed changes

          ### Download
          Download the JAR file below and run with:
          ```bash
          java -jar CVSmartAnalyzer-1.0-SNAPSHOT-jar-with-dependencies.jar
          ```

          ### Requirements
          - Java 25 or higher
          - Stanford CoreNLP dependencies
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/CVSmartAnalyzer-1.0-SNAPSHOT-jar-with-dependencies.jar
        asset_name: CVSmartAnalyzer-${{ steps.get_version.outputs.VERSION }}.jar
        asset_content_type: application/java-archive
